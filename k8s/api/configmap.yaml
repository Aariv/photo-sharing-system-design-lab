apiVersion: v1
kind: ConfigMap
metadata:
  name: photoshare-config
data:
  APP_ENVIRONMENT: "local"

  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: "host.docker.internal:19092"

  MINIO_URL: "http://host.docker.internal:9000"

  DATABASE_URL: "jdbc:postgresql://host.docker.internal:5432/photoshare"