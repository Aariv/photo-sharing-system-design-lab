services:

  postgres:
    image: postgres:16

    container_name: photoshare-postgres

    environment:
      POSTGRES_DB: photoshare
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: photoshare-redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3.8
    container_name: photoshare-localstack
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
    volumes:
      - ./localstack:/var/lib/localstack

volumes:
  postgres-data: