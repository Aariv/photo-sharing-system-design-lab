services:

  postgres:
    image: postgres:16

    container_name: photoshare-postgres

    environment:
      POSTGRES_DB: photoshare
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: photoshare-redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3.8
    container_name: photoshare-localstack
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
    volumes:
      - ./localstack:/var/lib/localstack

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2

    container_name: photoshare-redpanda

    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false

    ports:
      - "9092:9092"
      - "9644:9644"

  prometheus:
    image: prom/prometheus
    container_name: photoshare-prometheus
    ports:
      - "9090:9090"

    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: photoshare-grafana

    ports:
      - "3000:3000"

volumes:
  postgres-data: