services:

  postgres:
    image: postgres:16

    container_name: photoshare-postgres

    environment:
      POSTGRES_DB: photoshare
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: photoshare-redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3.8
    container_name: photoshare-localstack
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
    volumes:
      - ./localstack:/var/lib/localstack

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2

    container_name: photoshare-redpanda

    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false

    ports:
      - "9092:9092"
      - "9644:9644"

  prometheus:
    image: prom/prometheus
    container_name: photoshare-prometheus
    ports:
      - "9090:9090"

    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: photoshare-grafana

    ports:
      - "3000:3000"

  minio:
    image: minio/minio
    container_name: photoshare-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    command: server /data --console-address ":9001"

  jaeger:
    image: jaegertracing/all-in-one:latest

    container_name: photoshare-jaeger

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres-data: